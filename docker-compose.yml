services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - CUBIS_CONFIG=/app/config.yml
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cubis
      POSTGRES_PASSWORD: cubis_secret
      POSTGRES_DB: cubis_wkr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubis -d cubis_wkr"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
