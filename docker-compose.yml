services:
  # ── Control Plane ──
  app:
    build: .
    hostname: app
    ports:
      - "8083:8080"
    environment:
      - CUBIS_CONFIG=/app/config.yml
      - CUBIS_EDGE_ADVERTISE_ADDR=http://app:8080
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Edge Node ──
  edge-1:
    build: .
    hostname: edge-1
    environment:
      - CUBIS_CONFIG=/app/config-edge.yml
      - CUBIS_EDGE_ADVERTISE_ADDR=http://edge-1:8080
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    command: ["/app/wkr", "/app/config-edge.yml"]
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:8080/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: ["edge"]
    networks:
      - internal

  # ── Database ──
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cubis
      POSTGRES_PASSWORD: cubis_secret
      POSTGRES_DB: cubis_wkr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubis -d cubis_wkr"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Observability ──
  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - app
    profiles: ["monitoring"]
    networks:
      - internal

  grafana:
    image: grafana/grafana:12.0.1
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cubis
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/provisioning-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/cubis-wkr.json:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    profiles: ["monitoring"]
    networks:
      - internal

volumes:
  pgdata:
  prometheus_data:
  grafana_data:

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.200.0/24
