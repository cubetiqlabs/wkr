app:
  name: wkr
  version: 0.1.0
  env: development

server:
  host: 0.0.0.0
  port: 8080
  read_timeout: 10s
  write_timeout: 10s
  idle_timeout: 120s
  body_limit: 10485760 # 10MB
  cors_origins:        # restrict in production, e.g. ["https://app.example.com"]
    - "*"

database:
  host: db
  port: 5432
  user: cubis
  password: cubis_secret
  name: cubis_wkr
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  auto_migrate: true

auth:
  jwt_secret: change-me-in-production-use-env-var  # REJECTED in non-development envs
  jwt_expiry: 24h
  api_key_header: X-API-Key

runtime:
  max_execution_time: 30s
  max_memory_mb: 128
  max_concurrent_workers: 100
  sandbox_enabled: true
  encryption_key: change-me-32-char-secret-key!!   # REJECTED in non-development envs

edge:
  enabled: true
  node_id: node-1
  region: default
  role: control
  control_url: ""
  internal_secret: change-me-internal-secret       # shared secret for inter-node auth
  sync_interval: 30s
  heartbeat_interval: 10s
  failover_timeout: 30s

security:
  max_code_size_bytes: 1048576
  max_output_bytes: 5242880
  blocked_imports:
    - os/exec
    - syscall
    - unsafe
    - plugin
  blocked_js_globals:
    - Deno.run
    - Deno.Command
    - child_process
  network_disabled: false
  fs_disabled: true
  code_signing_key: ""
  rate_limit_per_worker: 100
  audit_log: true

metrics:
  enabled: true
  path: /metrics
  port: 0

log:
  level: info
  format: json

sentry:
  enabled: false
  dsn: ""
  environment: development
  traces_sample_rate: 0.2
  debug: false
