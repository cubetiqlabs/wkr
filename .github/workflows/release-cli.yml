name: Release wkr-cli

on:
  push:
    tags:
      - 'wkr-cli-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          go build -ldflags="-s -w" -o wkr-${GOOS}-${GOARCH}${EXT} ./cmd/cli

      - uses: actions/upload-artifact@v4
        with:
          name: wkr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: wkr-*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum wkr-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/wkr-*
            artifacts/checksums.txt
          generate_release_notes: true
